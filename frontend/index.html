    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%23073590' width='180' height='180' rx='40'/><text x='90' y='110' text-anchor='middle' font-size='100' fill='%23f6c915'>✈</text></svg>" />
    <title>Ryanair App - Wiam</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      const isLocalhost = ['localhost', '127.0.0.1', '::1'].includes(window.location.hostname);

      if ('serviceWorker' in navigator) {
        if (isLocalhost) {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            registrations.forEach((registration) => {
              registration.unregister();
            });
          });
        } else {
          navigator.serviceWorker.register('/sw.js').catch(() => {
            console.log('Service Worker registration failed');
          });
        }
      }
    </script>
  </body>
</html>
